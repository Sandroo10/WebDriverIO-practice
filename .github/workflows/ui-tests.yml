name: Weekly WebdriverIO Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: webdriverio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.browser }} UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'schedule' && fromJSON('["chrome", "firefox"]') || fromJSON('["chrome"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: |
          npm run format:check
          npm run lint

      - name: Run WebdriverIO tests
        run: npm test
        env:
          CI: 'true'
          BASE_URL: https://the-internet.herokuapp.com
          BROWSER: ${{ matrix.browser }}
          TEST_GREP: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '@smoke' || '' }}

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webdriverio-test-artifacts-${{ matrix.browser }}
          path: |
            artifacts/allure-results
            artifacts/allure-report
            artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14
