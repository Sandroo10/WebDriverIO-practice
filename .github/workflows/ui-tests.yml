name: Weekly WebdriverIO Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: webdriverio-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run WebdriverIO tests
        run: npm test
        env:
          CI: 'true'
          BASE_URL: https://the-internet.herokuapp.com

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webdriverio-test-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
